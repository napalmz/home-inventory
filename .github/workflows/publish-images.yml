name: Publish Docker images

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/publish-images.yml"
      - "!**/*.md"
  workflow_dispatch:
    inputs:
      channel:
        description: "Canale di pubblicazione"
        type: choice
        options:
          - dev
          - release
        default: dev

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine image tags
        id: meta
        shell: bash
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          backend_version="$(grep '^API_VERSION=' backend/.env | cut -d '=' -f2)"
          frontend_version="$(node -p "require('./frontend/package.json').version")"

          # Il push su main pubblica sempre la release; "dev" solo da avvio manuale
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$INPUT_CHANNEL" == "dev" ]]; then
            suffix="-dev"
            channel="dev"
          else
            suffix=""
            channel="latest"
          fi

          echo "backend_tag=${backend_version}${suffix}" >> "$GITHUB_OUTPUT"
          echo "frontend_tag=${frontend_version}${suffix}" >> "$GITHUB_OUTPUT"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BACKEND_VERSION=${{ steps.meta.outputs.backend_tag }}
          tags: |
            napalmzrpi/home-inventory-backend:${{ steps.meta.outputs.backend_tag }}
            napalmzrpi/home-inventory-backend:${{ steps.meta.outputs.channel }}
            ghcr.io/napalmz/home-inventory-backend:${{ steps.meta.outputs.backend_tag }}
            ghcr.io/napalmz/home-inventory-backend:${{ steps.meta.outputs.channel }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            FRONTEND_VERSION=${{ steps.meta.outputs.frontend_tag }}
          tags: |
            napalmzrpi/home-inventory-frontend:${{ steps.meta.outputs.frontend_tag }}
            napalmzrpi/home-inventory-frontend:${{ steps.meta.outputs.channel }}
            ghcr.io/napalmz/home-inventory-frontend:${{ steps.meta.outputs.frontend_tag }}
            ghcr.io/napalmz/home-inventory-frontend:${{ steps.meta.outputs.channel }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
